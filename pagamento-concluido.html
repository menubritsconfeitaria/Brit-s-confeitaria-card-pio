<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido recebido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg:#f7f1e8; --card:#ffffff; --muted:#8a7562;
        --primary:#a0522d; --border:#e6d9c6;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg);
        color: #3a2c22; display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 24px;
    }
    .cartao {
        background: var(--card); border: 1px solid var(--border); border-radius: 20px;
        padding: 36px 28px; max-width: 420px; width: 100%; text-align: center;
        box-shadow: 0 10px 30px rgba(160, 82, 45, 0.1);
    }
    .emoji { font-size: 3em; margin-bottom: 8px; }
    h1 { font-size: 1.3em; color: var(--primary); margin: 0 0 8px; }
    p { color: var(--muted); font-size: 0.95em; line-height: 1.5; margin: 0 0 6px; }
    .numero-pedido { font-weight: 700; color: #3a2c22; }
    .status-badge {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 10px 20px;
        border-radius: 20px; font-weight: 700; font-size: 0.95em;
    }
    .status-aguardando { background: #fff3cd; color: #8a6300; }
    .status-pago { background: #d4edda; color: #1e6b34; }
    .status-divergente { background: #f8d7da; color: #a53238; }
    .girando { display: inline-block; animation: girar 1.4s linear infinite; }
    @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    a.btn-voltar {
        display: inline-block; margin-top: 22px; background: var(--primary); color: #fff;
        text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 700;
    }
</style>
<link rel="icon" type="image/png" href="logopng.png">
</head>
<body>
    <div class="cartao">
        <div class="emoji" id="emojiPrincipal">🎉</div>
        <h1>Pedido recebido!</h1>
        <p>Seu pedido foi enviado com sucesso.</p>
        <p class="numero-pedido" id="numeroPedidoTexto">&nbsp;</p>
        <div id="statusBadge" class="status-badge status-aguardando">
            <span class="girando" id="iconeGirando">🔄</span> Confirmando pagamento...
        </div>
        <p id="statusTexto">Isso costuma ser rápido — pode aguardar aqui, a página se atualiza sozinha.</p>
        <br>
        <a href="index.html" class="btn-voltar">Voltar ao cardápio</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-functions-compat.js"></script>
    <script src="loja-config.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Essa página é pública (o cliente chega aqui sem estar logado) — por isso não lê
        // o pedido direto do banco. Consulta pela Cloud Function consultarStatusPedidoCliente,
        // que só devolve o status (sanitizado) pra quem tiver o token certo desse aparelho —
        // o mesmo token que já foi usado quando o pedido foi criado, no cardápio.
        const parametros = new URLSearchParams(window.location.search);
        // Aceita tanto o "pedido" que eu mesmo mando quanto o "order_nsu" que a InfinitePay
        // sempre inclui no retorno (é o mesmo valor) — cobre o caso de um dos dois "sumir"
        // por causa de como a InfinitePay monta a URL de volta
        const pedidoId = parametros.get('pedido') || parametros.get('order_nsu');
        const numeroTexto = document.getElementById('numeroPedidoTexto');
        const statusTexto = document.getElementById('statusTexto');
        const statusBadge = document.getElementById('statusBadge');

        // Mesma chave usada no cardápio (script.js) — precisa ser idêntica, senão esse
        // aparelho não é reconhecido como o dono do pedido que acabou de criar
        function obterTokenCliente() {
            try {
                let token = localStorage.getItem('tokenCliente');
                if (!token) {
                    token = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
                    localStorage.setItem('tokenCliente', token);
                }
                return token;
            } catch (e) { return null; }
        }

        function atualizarTelaComPedido(pedido) {
            if (!pedido) return;
            numeroTexto.textContent = pedido.numero ? `Pedido #${String(pedido.numero).padStart(3, '0')}` : '';

            const status = pedido.pagamento && pedido.pagamento.status;
            const ehSinal = pedido.pagamento && pedido.pagamento.tipoPagamento === 'sinal';
            if (status === 'pago') {
                statusBadge.className = 'status-badge status-pago';
                if (ehSinal) {
                    statusBadge.innerHTML = '🟢 Sinal confirmado!';
                    statusTexto.textContent = 'Recebemos o sinal e sua encomenda está confirmada! O restante fica combinado pra hora da entrega.';
                } else {
                    statusBadge.innerHTML = '🟢 Pagamento confirmado!';
                    statusTexto.textContent = `${typeof LOJA_CONFIG !== 'undefined' && LOJA_CONFIG ? LOJA_CONFIG.nome : 'A loja'} já recebeu seu pagamento e vai preparar seu pedido.`;
                }
                return true; // pode parar de consultar
            } else if (status === 'divergente') {
                statusBadge.className = 'status-badge status-divergente';
                statusBadge.innerHTML = '⚠️ Precisa de atenção';
                statusTexto.textContent = 'Encontramos uma diferença no valor do pagamento. A loja vai entrar em contato com você.';
                return true; // pode parar de consultar
            } else {
                statusBadge.className = 'status-badge status-aguardando';
                statusBadge.innerHTML = '<span class="girando">🔄</span> Confirmando pagamento...';
                statusTexto.textContent = 'Isso costuma ser rápido — pode aguardar aqui, a página se atualiza sozinha.';
                return false; // continua consultando
            }
        }

        let intervaloConsulta = null;
        async function consultarStatusUmaVez() {
            try {
                const consultar = firebase.functions().httpsCallable('consultarStatusPedidoCliente');
                const resposta = await consultar({ pedidoId, token: obterTokenCliente() });
                const pedido = resposta && resposta.data ? resposta.data.pedido : null;
                if (!pedido) return; // ainda não achou (ou aparelho não autorizado) — tenta de novo no próximo ciclo
                const resolvido = atualizarTelaComPedido(pedido);
                if (resolvido && intervaloConsulta) {
                    clearInterval(intervaloConsulta);
                    intervaloConsulta = null;
                }
            } catch (err) {
                console.log('Não foi possível consultar o status agora:', err.message);
            }
        }

        if (!pedidoId) {
            statusTexto.textContent = 'Não conseguimos identificar seu pedido automaticamente. Se você pagou, não se preocupe — a loja já foi avisada.';
        } else if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
            consultarStatusUmaVez(); // primeira consulta imediata
            intervaloConsulta = setInterval(consultarStatusUmaVez, 4000); // depois, a cada 4s até resolver
        }
    </script>
</body>
</html>
